# Bind this container only to host loopback. Access through SSH/VPN; never anonymous ingress.
server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control no-store always;
  location /api/ { proxy_pass http://gateway:3001; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_read_timeout 30s; }
  location / { try_files $uri $uri/ =404; }
}
